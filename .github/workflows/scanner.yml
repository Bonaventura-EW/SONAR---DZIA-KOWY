name: SONAR DZIAŁKOWY Scanner

on:
  schedule:
    # 2 scany dziennie (rynek działek zmienia się wolniej niż najem):
    # 8:37 i 18:37 CEST (offset minutowy: mniejsze ryzyko throttlingu GH + nie
    # koliduje z harmonogramami SONAR-POKOJOWY/MIESZKANIOWY)
    - cron: '37 6,16 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # FIX 2026-06-13: deploy Pages wprost w skanerze. Push skanu idzie przez
      # github.token (github-actions[bot]), a GitHub z założenia NIE budzi nim
      # innych workflowów (ochrona antyrekurencyjna) — przez co pages.yml nie
      # odpalał się po skanie i mapa stała na starych danych. Deploy w tym jobie
      # używa OIDC (id-token), nie triggera push, więc działa bez PAT_TOKEN.
      pages: write
      id-token: write

    # Deploy do środowiska github-pages (URL widoczny w podsumowaniu runa).
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          fetch-depth: 0
          # FIX 2026-06-12: harmonogram odpala workflow na gałęzi DOMYŚLNEJ
          # repo (claude/...), przez co commit ze skanem lądował na złej
          # gałęzi a push na main padał ('src refspec main does not match').
          # Wymuszamy pracę na main niezależnie od gałęzi domyślnej.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SONAR DZIAŁKOWY scanner
        continue-on-error: true
        run: |
          cd src
          python main.py || echo "::warning::Scanner failed but continuing..."

      - name: Generate map data
        if: always()
        continue-on-error: true
        run: |
          cd src
          python map_generator.py || echo "::warning::Map generator failed but continuing..."

      - name: Generate trend data
        if: always()
        continue-on-error: true
        run: |
          cd src
          python trend_generator.py || echo "::warning::Trend generator failed but continuing..."

      - name: Generate API
        if: always()
        continue-on-error: true
        run: |
          cd src
          python api_generator.py || echo "::warning::API generator failed but continuing..."

      - name: Generate monitoring data
        if: always()
        continue-on-error: true
        run: |
          cd src
          python monitoring_generator.py || echo "::warning::Monitoring generator failed but continuing..."

      - name: Generate agency data
        if: always()
        continue-on-error: true
        run: |
          cd src
          python agency_generator.py || echo "::warning::Agency generator failed but continuing..."

      - name: Commit and push changes
        if: always()
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add data/ docs/data.json docs/trend_data.json docs/api/ docs/monitoring_data.json docs/agency_data.json || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "🤖 Automatyczny scan: $(TZ='Europe/Warsaw' date +'%Y-%m-%d %H:%M')" || true

          # pull --rebase + retry: skan może kolidować z manualnymi commitami
          for attempt in 1 2 3; do
            echo "📤 Push attempt #$attempt..."
            if ! git pull --rebase origin main; then
              echo "::warning::Rebase #$attempt nie powiódł się. Próbuję ponownie."
              git rebase --abort 2>/dev/null || true
              sleep 5
              continue
            fi
            if git push origin HEAD:main; then
              echo "✅ Push successful (attempt #$attempt)"
              exit 0
            else
              echo "::warning::Push #$attempt odrzucony. Retry za 10s..."
              sleep 10
            fi
          done

          echo "::error::Push failed po 3 próbach"
          exit 1

      # FIX 2026-06-13: publikacja docs/ na GitHub Pages w tym samym jobie.
      # if: always() — mapa ma się odświeżyć nawet gdy push danych się nie udał
      # (wygenerowane docs/ i tak są aktualne wobec stanu skanu).
      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
