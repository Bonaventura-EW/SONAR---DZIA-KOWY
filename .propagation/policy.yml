# ── Polityka propagacji dla TEGO repo ─────────────────────────────────
# Ten plik ROŚNIE w czasie. To jest "pamięć granic" agenta.
# Na starcie jest prawie pusty → wszystko trafia do Ciebie jako issue.
# Zmiany w tym pliku wchodzą przez PR, który zatwierdzasz (tak jak kod).
# Zła reguła nie wślizgnie się po cichu.

repo: "Bonaventura-EW/SONAR---DZIA-KOWY"          # owner/name TEGO repo
family: "sonary"        # nazwa rodziny (bracia mają tę samą)

# Rodzeństwo, którego zmiany ten repo ma przeglądać co przebieg:
siblings:
  - Bonaventura-EW/SONAR-POKOJOWY
  - Bonaventura-EW/SONAR-MIESZKANIOWY
  - Bonaventura-EW/Sprzedaz-mieszkan
  - Bonaventura-EW/parkingi-i-garaze      # pozostałe repo z tej rodziny, po jednym w linii jako  - owner/name

# ── TWARDE GRANICE (siatka bezpieczeństwa — rusza się rzadko) ─────────
# Propagacja NIGDY nie dotyka tych ścieżek, niezależnie od werdyktu.
never_touch:
  - ".propagation/**"
  - ".github/workflows/**"
  - ".claude/**"
  #  - "src/payments/**"
  #  - "src/config/secrets*"

# ── MIĘKKA POLITYKA (to jest to, co się UCZY) ────────────────────────
# Poziom autonomii per kategoria zmiany — steruje etykietą `propagate:go`,
# która wyzwala etap implementacji (Opus):
#   ask    → issue BEZ `propagate:go`. Ty nakładasz etykietę, gdy chcesz zbudować.
#            (DOMYŚLNIE — poziom 0, Ty jesteś kontrolerem)
#   draft  → etap decyzji sam nakłada `propagate:go` → Opus pisze DRAFT PR.
#            (poziom 1 — po awansie zasłużonym w decisions.jsonl)
#   AUTO-MERGE NIE ISTNIEJE. Ostatni, nieodwracalny krok zawsze robi człowiek.
#
# MODELE: decyzje = Sonnet (claude-sonnet-5), programowanie = Opus (claude-opus-4-8).
default_autonomy: ask

# 2026-09-29 distill-policy: DWIE kategorie osiągnęły próg awansu.
# bugfix: 8 rozstrzygnięć (7 accepted + 1 modified), 100% w kierunku "buduj",
# 0 odrzuceń bezpieczeństwa. feature: 9 rozstrzygnięć, 100% accepted, 0
# odrzuceń bezpieczeństwa. Obie awansowane na "draft". css-refactor ma
# 1 rozstrzygnięcie — za mało danych, zostaje "ask". Zobacz PR dla scorecardu.
categories:
  bugfix: draft
  feature: draft
  # css-refactor:   draft
  # a11y-fix:       draft
  # dependency-bump: ask

# Reguły destylowane z Twoich decyzji — dopisuje je skill `distill-policy`
# przez PR, który zatwierdzasz. Ręcznie też możesz.
learned_rules:
  - "Propozycje wskazujące na już istniejące, ale niewykorzystane dane/kod w tym repo (np. pola w bazie, nieużywane funkcje) są tanie we wdrożeniu i dotąd zawsze akceptowane (7/7 decyzji: issue#13 – price_per_m2/district; issue#18 – reactivation_dates/deactivation_dates/promoted_dates x3; issue#20 – build_spans/life_events; issue#27 – price_changes już gotowe w main.py; issue#34 – origin-filter-checkboxes, rozszerzenie enuma statusów)."
  - "Propozycje bugfix/css-refactor poparte dowodem zweryfikowanym wprost w naszym kodzie (nie tylko opisanym w manifeście źródłowym) są dotąd zawsze akceptowane (9/9 decyzji: issue#14 – zmierzone stosy do 23 ofert; issue#19 – zmierzona duplikacja 7 stron; issue#20 – własny komentarz w trend_generator.py; issue#21 – zweryfikowanie __PRERENDERED_STATE__ najpierw; issue#22 – potwierdzone w olx/otodom/adresowo_scraper.py i main.py; issue#24 – zweryfikowany wzorzec w otodom_scraper.py/adresowo_scraper.py; issue#25 – scoped naprawa atrybucji odpływu; issue#26 – identyczny kod filtrów neu/gone co Sprzedaz-mieszkan#23; issue#35 – scan-gap-coverage, budowa z pomiarem najpierw). **AWANS bugfix na 'draft' (2026-09-29)**."
  - "Feature: 9/9 decyzji accepted łącznie z kosmetycznymi rozszerzeniami wykresów (issue#33 – apexcharts-month-bands, minimalne ryzyko) i rozszerzeniami istniejących mechanizmów (issue#34 – origin-filter-checkboxes). **AWANS feature na 'draft' (2026-09-29)**."
